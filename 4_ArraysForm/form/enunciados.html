    <h3>Ejercicio 2</h3>
    <p>Genera un array de números aleatorios y filtra según un criterio específico</p>
    <form action="soluciones.php" method="post">
        <input type="hidden" name="ejercicios" value="ej2">
        <label for="numeros">Números: <input type="number" name="numeros" id="numeros"></label><br>
        <label for="min">Valor min: <input type="number" name="min" id="min"></label><br>
        <label for="max">Valor max: <input type="number" name="max" id="max"></label><br>
        <select name="filtro">
            <option disabled selected>--FILTRO--</option>
            <option value="pares">Pares</option>
            <option value="primos">Primos</option>
            <option value="perfectos">Perfectos</option>
        </select>
        <!-- 
        4 CAMPOS:   1 => cantidad de números aleatorios que voy a generar
                    2 => valor mínimo que puede tener los números random
                    3 => valor máximo ...
                    4 => filtro (numeros pares || números primos || números perfectos)
        Me devolverá el array original y el array con el filtro aplicado
        -->
        <input type="submit" value="ENVIAR">
    </form>
